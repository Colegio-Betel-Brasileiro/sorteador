<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Sorteios - Colégio Betel Brasileiro</title>
  
  <!-- Fonte Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  
  <!-- Biblioteca de Confetes para Premiação -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --betel-navy: #0A2240;
      --betel-blue: #00509D;
      --betel-yellow: #FFB800;
      --betel-yellow-hover: #E0A200;
      --betel-red: #D90429;
      --betel-bg: #F4F7FA;
      --betel-card: #FFFFFF;
      --betel-text: #1E293B;
      --betel-muted: #64748B;
      --betel-border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: var(--betel-bg);
      color: var(--betel-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background-color: var(--betel-navy);
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 5px solid var(--betel-yellow);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      z-index: 10;
      height: 76px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo-img {
      height: 54px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));
    }

    .brand-title h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #FFFFFF;
      line-height: 1.1;
    }

    .brand-title p {
      font-size: 11px;
      color: var(--betel-yellow);
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .app-container {
      display: flex;
      flex-direction: row;
      gap: 16px;
      padding: 16px;
      flex: 1;
      width: 100%;
      max-width: 100vw;
      box-sizing: border-box;
      align-items: stretch;
    }

    .panel {
      background: var(--betel-card);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(10, 34, 64, 0.06);
      border: 1px solid var(--betel-border);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .sidebar {
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), min-width 0.4s cubic-bezier(0.4, 0, 0.2, 1), flex 0.4s ease;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-left {
      width: 330px;
    }

    .sidebar-left.collapsed {
      width: 58px;
      min-width: 58px;
    }

    .sidebar-right {
      width: 300px;
    }

    .sidebar-right.collapsed {
      width: 58px;
      min-width: 58px;
    }

    /* Conteúdo Expandido vs Minimizado */
    .expanded-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      height: 100%;
      opacity: 1;
      transition: opacity 0.25s ease;
      width: 330px;
    }

    .sidebar-right .expanded-content {
      width: 300px;
    }

    .sidebar.collapsed .expanded-content {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    .collapsed-content {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 14px 6px;
      height: 100%;
      cursor: pointer;
      user-select: none;
    }

    .sidebar.collapsed .collapsed-content {
      display: flex;
    }

    .collapsed-btn {
      background: var(--betel-navy);
      color: var(--betel-yellow);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(10, 34, 64, 0.15);
      transition: background 0.2s, transform 0.2s;
    }

    .collapsed-btn:hover {
      background: var(--betel-blue);
      color: #fff;
      transform: scale(1.05);
    }

    .vertical-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 12px;
      font-weight: 800;
      color: var(--betel-navy);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .vertical-label .count-pill {
      background: var(--betel-yellow);
      color: var(--betel-navy);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 11px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid #F1F5F9;
      margin-bottom: 15px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--betel-navy);
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge {
      background-color: var(--betel-navy);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      height: 260px;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--betel-blue);
      box-shadow: 0 0 0 3px rgba(0, 80, 157, 0.15);
    }

    .btn {
      background-color: var(--betel-blue);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .btn:hover {
      background-color: var(--betel-navy);
      transform: translateY(-1px);
    }

    .btn-yellow {
      background-color: var(--betel-yellow);
      color: var(--betel-navy);
    }

    .btn-yellow:hover {
      background-color: var(--betel-yellow-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--betel-border);
      color: var(--betel-muted);
    }

    .btn-outline:hover {
      background-color: #F1F5F9;
      color: var(--betel-navy);
    }

    .btn-danger-outline {
      background: transparent;
      border: 1.5px solid rgba(217, 4, 41, 0.3);
      color: var(--betel-red);
      margin-top: 8px;
    }

    .btn-danger-outline:hover {
      background-color: #FFF5F5;
      border-color: var(--betel-red);
    }

    .btn-icon {
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 8px;
    }

    .draw-stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .draw-stage {
      flex: 1;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
      border-radius: 20px;
      border: 2px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(10, 34, 64, 0.02);
    }

    .stage-watermark {
      position: absolute;
      opacity: 0.04;
      pointer-events: none;
      max-width: 500px;
      width: 65%;
      user-select: none;
    }

    .countdown-display {
      font-size: clamp(90px, 16vw, 210px);
      font-weight: 900;
      color: var(--betel-navy);
      line-height: 1;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      z-index: 2;
      text-shadow: 0 6px 25px rgba(10, 34, 64, 0.12);
    }

    .countdown-display.pulse {
      animation: numberPulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes numberPulse {
      0% { transform: scale(0.92); opacity: 0.85; color: var(--betel-navy); }
      100% { transform: scale(1.18); opacity: 1; color: var(--betel-yellow-hover); }
    }

    .winner-box {
      z-index: 2;
      width: 92%;
      max-width: 780px;
      background: #FFFFFF;
      border: 3px dashed var(--betel-yellow);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(255, 184, 0, 0.3);
      margin-top: 10px;
      display: none;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.65) translateY(30px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .winner-label {
      font-size: 15px;
      font-weight: 800;
      color: var(--betel-blue);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .winner-name {
      font-size: clamp(28px, 4.5vw, 52px);
      font-weight: 900;
      color: var(--betel-navy);
      line-height: 1.15;
      word-break: break-word;
    }

    .btn-draw {
      z-index: 2;
      padding: 20px 60px;
      font-size: clamp(18px, 2.2vw, 24px);
      border-radius: 60px;
      box-shadow: 0 10px 30px rgba(255, 184, 0, 0.45);
      margin-top: 30px;
      width: 90%;
      max-width: 420px;
      font-weight: 800;
    }

    .btn-draw:disabled {
      background-color: #E2E8F0;
      color: #94A3B8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .history-list {
      list-style: none;
      overflow-y: auto;
      max-height: calc(100vh - 280px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .history-item {
      background-color: #F8FAFC;
      border-left: 4px solid var(--betel-yellow);
      padding: 12px 14px;
      border-radius: 0 10px 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeInRight 0.3s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      border-top: 1px solid #F1F5F9;
      border-right: 1px solid #F1F5F9;
      border-bottom: 1px solid #F1F5F9;
    }

    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(15px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .history-index {
      font-weight: 800;
      color: var(--betel-blue);
      font-size: 11px;
      text-transform: uppercase;
      background: rgba(0, 80, 157, 0.08);
      padding: 3px 8px;
      border-radius: 12px;
    }

    .history-name {
      font-weight: 700;
      color: var(--betel-navy);
      font-size: 14px;
    }

    .empty-history {
      color: var(--betel-muted);
      font-size: 13px;
      text-align: center;
      padding: 30px 10px;
      font-style: italic;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 34, 64, 0.65);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #fff;
      border-radius: 20px;
      padding: 26px 30px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      transform: scale(0.9);
      transition: transform 0.2s ease;
      text-align: center;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--betel-navy);
      margin-bottom: 10px;
    }

    .modal-text {
      font-size: 14px;
      color: var(--betel-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    @media (max-width: 900px) {
      .app-container {
        flex-direction: column;
      }

      .sidebar-left, .sidebar-left.collapsed, .sidebar-right, .sidebar-right.collapsed {
        width: 100%;
        min-width: 100%;
      }

      .expanded-content, .sidebar-right .expanded-content {
        width: 100%;
      }

      .vertical-label {
        writing-mode: horizontal-tb;
        transform: none;
        margin-top: 0;
      }

      .sidebar.collapsed .collapsed-content {
        flex-direction: row;
        justify-content: space-between;
        padding: 10px 16px;
      }

      .draw-stage {
        min-height: 380px;
      }
    }

    footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: var(--betel-muted);
      background: #E2E8F0;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="https://static.wixstatic.com/media/cf1120_66bbd654e15a43fc86e4949f4a70c52b~mv2.png/v1/fill/w_270,h_202,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/betel%2040%20anos.png" alt="Logo Colégio Betel Brasileiro 40 Anos" class="brand-logo-img" />
      <div class="brand-title">
        <h1>Colégio Betel Brasileiro</h1>
        <p>SISTEMA OFICIAL DE SORTEIOS</p>
      </div>
    </div>
  </header>

  <div class="app-container">
    
    <!-- PAINEL ESQUERDO: PARTICIPANTES (COLAPSO LATERAL ESQUERDO) -->
    <div id="sidebarLeft" class="panel sidebar sidebar-left">
      
      <!-- Visão Expandida -->
      <div class="expanded-content">
        <div class="panel-header">
          <div class="panel-title">📋 Participantes</div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span id="remainingBadge" class="badge">0 restantes</span>
            <button class="btn btn-outline btn-icon" onclick="toggleLeftPanel(true)" title="Minimizar para a esquerda (◄)">
              ◄
            </button>
          </div>
        </div>

        <textarea id="namesInput" placeholder="Cole ou digite um nome por linha...&#10;&#10;Exemplo:&#10;Maria Silva&#10;João Pedro&#10;Ana Souza"></textarea>
        
        <button class="btn btn-yellow" style="margin-top: 12px;" onclick="loadParticipants(true)">
          ✔ Carregar Lista & Fechar ◄
        </button>
        <button class="btn btn-danger-outline" onclick="promptResetAll()">
          🔄 Reiniciar Sessão
        </button>
      </div>

      <!-- Visão Minimizada Lateral -->
      <div class="collapsed-content" onclick="toggleLeftPanel(false)" title="Clique para expandir participantes">
        <button class="collapsed-btn" title="Expandir lista (►)">
          ►
        </button>
        <div class="vertical-label">
          <span>👥 Participantes</span>
          <span id="collapsedCountPill" class="count-pill">0</span>
        </div>
      </div>

    </div>

    <!-- ARENA CENTRAL DO SORTEIO (EXPANSIBILIDADE MÁXIMA) -->
    <div class="draw-stage-container">
      <div class="panel draw-stage">
        <!-- Marca D'água sutil -->
        <img src="https://static.wixstatic.com/media/cf1120_66bbd654e15a43fc86e4949f4a70c52b~mv2.png/v1/fill/w_270,h_202,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/betel%2040%20anos.png" class="stage-watermark" alt="Watermark Betel" />

        <div id="countdownDisplay" class="countdown-display">READY</div>

        <div id="winnerBox" class="winner-box">
          <div class="winner-label">🎉 PARABÉNS! SORTEADO(A):</div>
          <div id="winnerName" class="winner-name">---</div>
        </div>

        <button id="drawBtn" class="btn btn-yellow btn-draw" onclick="startDraw()" disabled>
          SORTEAR AGORA
        </button>
      </div>
    </div>

    <!-- PAINEL DIREITO: HISTÓRICO (COLAPSO LATERAL DIREITO) -->
    <div id="sidebarRight" class="panel sidebar sidebar-right">
      
      <!-- Visão Expandida -->
      <div class="expanded-content">
        <div class="panel-header">
          <div class="panel-title">🏆 Histórico</div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span id="drawnBadge" class="badge" style="background-color: var(--betel-yellow); color: var(--betel-navy);">0 sorteados</span>
            <button class="btn btn-outline btn-icon" onclick="toggleRightPanel(true)" title="Minimizar para a direita (►)">
              ►
            </button>
          </div>
        </div>
        <ul id="historyList" class="history-list">
          <div id="emptyHistory" class="empty-history">Nenhum nome sorteado nesta sessão ainda.</div>
        </ul>
      </div>

      <!-- Visão Minimizada Lateral -->
      <div class="collapsed-content" onclick="toggleRightPanel(false)" title="Clique para expandir histórico">
        <button class="collapsed-btn" title="Expandir histórico (◄)">
          ◄
        </button>
        <div class="vertical-label">
          <span>🏆 Histórico</span>
          <span id="collapsedHistoryPill" class="count-pill">0</span>
        </div>
      </div>

    </div>

  </div>

  <!-- Modal Customizado -->
  <div id="customModal" class="modal-overlay">
    <div class="modal-card">
      <div id="modalTitle" class="modal-title">Aviso</div>
      <div id="modalText" class="modal-text">Mensagem...</div>
      <div id="modalActions" class="modal-actions">
        <!-- Botoes inseridos dinamicamente via JS -->
      </div>
    </div>
  </div>

  <footer>
    Colégio Betel Brasileiro &copy; <span id="year"></span> - Todos os direitos reservados.
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    let availableParticipants = [];
    let historyParticipants = [];
    let isDrawing = false;

    // Alternar Painel Esquerdo (Participantes)
    function toggleLeftPanel(collapse = null) {
      const sidebarLeft = document.getElementById('sidebarLeft');
      if (collapse === null) {
        sidebarLeft.classList.toggle('collapsed');
      } else if (collapse) {
        sidebarLeft.classList.add('collapsed');
      } else {
        sidebarLeft.classList.remove('collapsed');
      }
    }

    // Alternar Painel Direito (Histórico)
    function toggleRightPanel(collapse = null) {
      const sidebarRight = document.getElementById('sidebarRight');
      if (collapse === null) {
        sidebarRight.classList.toggle('collapsed');
      } else if (collapse) {
        sidebarRight.classList.add('collapsed');
      } else {
        sidebarRight.classList.remove('collapsed');
      }
    }

    function loadParticipants(autoCollapse = false) {
      if (isDrawing) return;
      const rawText = document.getElementById('namesInput').value;
      
      const lines = rawText.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0);

      // Desduplica em relação ao histórico já sorteado na sessão
      availableParticipants = lines.filter(name => !historyParticipants.includes(name));

      updateBadges();

      const drawBtn = document.getElementById('drawBtn');
      const countDisplay = document.getElementById('countdownDisplay');

      if (availableParticipants.length > 0) {
        drawBtn.disabled = false;
        if (['READY', 'FIM'].includes(countDisplay.textContent.trim())) {
          countDisplay.textContent = '🏁';
        }

        if (autoCollapse) {
          toggleLeftPanel(true); // Fecha lateralmente para dar espaço ao sorteio
        }
      } else {
        drawBtn.disabled = true;
        if (lines.length > 0 && availableParticipants.length === 0) {
          countDisplay.textContent = 'FIM';
          openCustomAlert('Atenção', 'Todos os participantes desta lista já foram sorteados nesta sessão!');
        } else {
          openCustomAlert('Lista Vazia', 'Por favor, digite ou cole pelo menos um nome para carregar a lista.');
        }
      }
    }

    function startDraw() {
      if (isDrawing || availableParticipants.length === 0) return;

      isDrawing = true;
      const drawBtn = document.getElementById('drawBtn');
      const countdownDisplay = document.getElementById('countdownDisplay');
      const winnerBox = document.getElementById('winnerBox');

      drawBtn.disabled = true;
      winnerBox.style.display = 'none';
      countdownDisplay.classList.add('pulse');

      let count = 5;
      countdownDisplay.textContent = count;

      const timer = setInterval(() => {
        count--;
        if (count >= 0) {
          countdownDisplay.textContent = count;
        } else {
          clearInterval(timer);
          countdownDisplay.classList.remove('pulse');
          executeWinnerSelection();
        }
      }, 1000);
    }

    function executeWinnerSelection() {
      const countdownDisplay = document.getElementById('countdownDisplay');
      const winnerBox = document.getElementById('winnerBox');
      const winnerName = document.getElementById('winnerName');

      // Seleção aleatória
      const randomIndex = Math.floor(Math.random() * availableParticipants.length);
      const winner = availableParticipants[randomIndex];

      // Remove do pool de ativos
      availableParticipants.splice(randomIndex, 1);

      // Adiciona ao topo do histórico
      historyParticipants.unshift(winner);

      // Atualiza visualização da arena
      countdownDisplay.textContent = '🎉';
      winnerName.textContent = winner;
      winnerBox.style.display = 'block';

      // Dispara confetes com as cores do Betel
      triggerConfetti();

      updateHistoryUI();
      updateBadges();

      isDrawing = false;
      if (availableParticipants.length > 0) {
        document.getElementById('drawBtn').disabled = false;
      } else {
        document.getElementById('drawBtn').disabled = true;
      }
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 130,
          spread: 85,
          origin: { y: 0.6 },
          colors: ['#0A2240', '#00509D', '#FFB800', '#D90429']
        });
      }
    }

    function updateHistoryUI() {
      const historyList = document.getElementById('historyList');
      const emptyHistory = document.getElementById('emptyHistory');

      if (historyParticipants.length > 0 && emptyHistory) {
        emptyHistory.style.display = 'none';
      }

      historyList.innerHTML = '';
      
      historyParticipants.forEach((name, idx) => {
        const orderNumber = historyParticipants.length - idx;
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span class="history-name">${name}</span>
          <span class="history-index">${orderNumber}º Sorteado</span>
        `;
        historyList.appendChild(li);
      });
    }

    function updateBadges() {
      const rem = availableParticipants.length;
      const drawn = historyParticipants.length;

      document.getElementById('remainingBadge').textContent = `${rem} restantes`;
      document.getElementById('collapsedCountPill').textContent = `${rem}`;
      
      document.getElementById('drawnBadge').textContent = `${drawn} sorteados`;
      document.getElementById('collapsedHistoryPill').textContent = `${drawn}`;
    }

    function openCustomAlert(title, message) {
      const modal = document.getElementById('customModal');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalText').textContent = message;
      
      const actions = document.getElementById('modalActions');
      actions.innerHTML = `
        <button class="btn btn-yellow" onclick="closeCustomModal()">Entendido</button>
      `;
      modal.classList.add('active');
    }

    function promptResetAll() {
      const modal = document.getElementById('customModal');
      document.getElementById('modalTitle').textContent = 'Reiniciar Sessão?';
      document.getElementById('modalText').textContent = 'Isso limpará os participantes digitados e o histórico de sorteados desta sessão.';
      
      const actions = document.getElementById('modalActions');
      actions.innerHTML = `
        <button class="btn btn-outline" onclick="closeCustomModal()">Cancelar</button>
        <button class="btn btn-yellow" onclick="confirmResetAll()">Sim, Reiniciar</button>
      `;
      modal.classList.add('active');
    }

    function confirmResetAll() {
      closeCustomModal();
      availableParticipants = [];
      historyParticipants = [];
      document.getElementById('namesInput').value = '';
      document.getElementById('historyList').innerHTML = '<div id="emptyHistory" class="empty-history">Nenhum nome sorteado nesta sessão ainda.</div>';
      document.getElementById('winnerBox').style.display = 'none';
      document.getElementById('countdownDisplay').textContent = 'READY';
      document.getElementById('drawBtn').disabled = true;
      toggleLeftPanel(false); // Reabre o painel para o usuário colar novos nomes
      updateBadges();
    }

    function closeCustomModal() {
      document.getElementById('customModal').classList.remove('active');
    }
  </script>
</body>
</html>
